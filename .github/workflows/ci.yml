name: Industrial Release Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  packages: write  # No more "contents: write" needed!

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Install Helm on the build runner
    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: 'v3.12.0'

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Git Commit SHA
      id: git_meta
      run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    # 1. Build and Push the App Container
    - name: Build and Push Enterprise Container Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ghcr.io/arcturusconsulting/issem-orchestrator:v0.1.0-${{ env.SHORT_SHA }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 2. Package and Push the Helm Chart as an OCI Package
    - name: Publish Helm Chart to GHCR
      run: |
        # Log Helm client into GHCR
        echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
        
        # Package the chart, dynamically injection the version matching our container tag
        helm package deploy/issem-chart \
          --version "0.1.0-${{ env.SHORT_SHA }}" \
          --app-version "v0.1.0-${{ env.SHORT_SHA }}"
          
        # Push the packaged chart package to our OCI registry space
        helm push issem-chart-0.1.0-${{ env.SHORT_SHA }}.tgz oci://ghcr.io/arcturusconsulting