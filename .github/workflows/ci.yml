name: Industrial Release Pipeline

on:
  push:
    tags: [ "v*.*.*" ] # Triggers the build whenever a new version tag is pushed

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: 'v3.12.0'

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Extract clean semver from Git tag (e.g., v1.0.0 -> 1.0.0)
    - name: Extract Clean Version
      id: version_meta
      run: |
        CLEAN_VERSION=${{ github.ref_name }}
        CLEAN_VERSION=${CLEAN_VERSION#v}
        echo "APP_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV

    # 1. Build and Push Public Container Image
    - name: Build and Push Container Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/arcturusconsulting/issem-gateway:${{ env.APP_VERSION }}
          ghcr.io/arcturusconsulting/issem-gateway:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 2. Package and Push Helm Chart as an OCI Package
    - name: Publish Helm Chart to GHCR
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
        
        helm package deploy/issem-chart \
          --version "${{ env.APP_VERSION }}" \
          --app-version "${{ env.APP_VERSION }}"
          
        helm push issem-gateway-${{ env.APP_VERSION }}.tgz oci://ghcr.io/arcturusconsulting/charts