    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: main # ◄ Force checkout of the main branch cleanly

    # Set up advanced Docker Buildx engine
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Git Commit SHA
      id: git_meta
      run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    # Build and push utilizing native GitHub Actions cloud caching
    - name: Build and Push Enterprise Container Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ghcr.io/arcturusconsulting/issem-orchestrator:v0.1.0-${{ env.SHORT_SHA }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Dynamically rewrite the chart values
    - name: Update Helm Chart Values
      run: |
        sed -i 's|repository: .*|repository: ghcr.io/arcturusconsulting/issem-orchestrator|' deploy/issem-chart/values.yaml
        sed -i 's|tag: .*|tag: "v0.1.0-${{ env.SHORT_SHA }}"|' deploy/issem-chart/values.yaml

    # Commit the manifest update back to the main branch
    - name: Commit and Push Manifest Update
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add deploy/issem-chart/values.yaml
        git commit -m "ci: update image tag to v0.1.0-${{ env.SHORT_SHA }} [skip ci]"
        git push origin HEAD:main # ◄ Push strictly back to main