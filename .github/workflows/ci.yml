name: Industrial Release Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Dependency Cache
      uses: swatinem/rust-cache@v2

    - name: Run Compilation Check
      run: cargo check --workspace

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # NEW: Automatically extract the short 7-character Git Commit ID
    - name: Extract Git Commit SHA
      id: git_meta
      run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    # UPDATED: Tag the container with your semantic version + the unique commit SHA
    - name: Build and Push Enterprise Container Image
      run: |
        docker build -t ghcr.io/arcturusconsulting/issem-orchestrator:v0.1.0-${{ env.SHORT_SHA }} .
        docker push ghcr.io/arcturusconsulting/issem-orchestrator:v0.1.0-${{ env.SHORT_SHA }}