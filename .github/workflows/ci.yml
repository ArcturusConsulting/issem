name: Industrial Release Pipeline

on:
  push:
    branches: [ "main" ] # ◄ TARGETS THE MAIN BRANCH ONLY. No development branch noise.
    paths-ignore:
      - 'deploy/**' # Prevents infinite loop when the bot commits values.yaml

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:Run git config --global user.name "github-actions[bot]"
