apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: issem-gateway
  namespace: argocd
spec:
  project: default

  source:
    repoURL: ghcr.io/arcturusconsulting
    chart: issem-gateway
    targetRevision: 0.0.0-snapshot-46f1357

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true