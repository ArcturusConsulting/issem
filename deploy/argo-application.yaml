apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: issem-gateway
  namespace: argocd
spec:
  project: default

  source:
    repoURL: ghcr.io/arcturusconsulting/charts
    chart: issem-gateway
    targetRevision: 0.1.4
    helm:
      parameters:
        - name: image.tag
          value: 0.1.4
      values: |
        hostPaths:
          configJson: "/home/norrie/issem/deploy/config.json"
          opcUaMappingJson: "/home/norrie/issem/deploy/opc_ua_mapping.json"

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true