apiVersion: apps/v1
kind: Deployment
metadata:
  name: issem-gateway
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: issem-core
  template:
    metadata:
      labels:
        app: issem-core
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: orchestrator
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: ISSEM_PLC_ENDPOINT
          value: {{ .Values.envOverrides.plcEndpoint | quote }}
        - name: ISSEM_REDIS_URL
          value: {{ .Values.envOverrides.redisUrl | quote }}
        livenessProbe:
          exec:
            command:
            - pidof
            - issem_core
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: global-config
          mountPath: /app/config.json
        - name: opc-mapping
          mountPath: /app/opc_ua_mapping.json
      volumes:
      - name: global-config
        hostPath:
          path: {{ .Values.hostPaths.configJson }}
          type: File
      - name: opc-mapping
        hostPath:
          path: {{ .Values.hostPaths.opcUaMappingJson }}
          type: File
